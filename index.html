/* =====================================================================
   Fôlego · sistema visual v3
   DM Sans · azul profundo · fundo levemente azulado · ícones Lucide
   ===================================================================== */
:root{
  --brand-base:#1D4ED8;
  --brand:var(--brand-base);
  --brand-ink:#FFFFFF;
  --brand-deep:color-mix(in srgb, var(--brand-base) 72%, #071233);
  --brand-soft:color-mix(in srgb, var(--brand) 9%, var(--surface));
  --brand-mid:color-mix(in srgb, var(--brand) 22%, var(--surface));
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#F6F8FC; --line:#E4E9F1; --line2:#D3DAE6;
  --ink:#1F2633; --ink2:#566174; --ink3:#8792A5;
  --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
  --ok-soft:color-mix(in srgb, var(--ok) 11%, var(--surface));
  --warn-soft:color-mix(in srgb, var(--warn) 12%, var(--surface));
  --bad-soft:color-mix(in srgb, var(--bad) 10%, var(--surface));
  --track:color-mix(in srgb, var(--ink) 7%, var(--surface));
  --shadow:0 1px 2px rgba(16,32,72,.05), 0 4px 16px rgba(16,32,72,.04);
  --r:18px; --r-sm:12px;
  --font:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:64px;
}
:root[data-mode="dark"]{
  --bg:#0C1017; --surface:#151A23; --surface2:#1B212C; --line:#242B38; --line2:#303848;
  --ink:#E7EBF2; --ink2:#A4ADBD; --ink3:#727C8E;
  --ok:#3FBF7F; --warn:#E5A23A; --bad:#F2727A;
  --brand:color-mix(in srgb, var(--brand-base) 70%, white);
  --brand-ink:#0C1017;
  --brand-deep:color-mix(in srgb, var(--brand-base) 60%, #050914);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--brand)}
.num,.v,.amount{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ic.s16{width:16px;height:16px}.ic.s18{width:18px;height:18px}.ic.s22{width:22px;height:22px}.ic.s24{width:24px;height:24px}
.muted{color:var(--ink3);font-size:13px}
.sub{color:var(--ink2);font-size:13.5px}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand svg.logo{width:32px;height:32px;flex:none}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.side .new{margin:0 4px 14px}
.nav-btn{display:flex;align-items:center;gap:12px;border:none;background:none;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:500;font-size:14.5px;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn.on{background:var(--brand-soft);color:var(--brand)}
.side .spacer{flex:1}
.side-foot{font-size:12px;color:var(--ink3);padding:8px 12px;display:flex;gap:6px;align-items:center}
main{min-width:0;padding:24px 32px 64px;width:100%;max-width:1120px}
.top-mini{display:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:24px;font-weight:600}
.head .hi{color:var(--ink3);font-size:13.5px;font-weight:500;margin-bottom:2px}
.period{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.period b{min-width:96px;text-align:center;font-size:13.5px;font-weight:600;text-transform:capitalize}
.period button{border:none;background:none;width:30px;height:30px;border-radius:50%;color:var(--ink2);display:grid;place-items:center}
.period button:hover{background:var(--surface2);color:var(--ink)}
.period .today{width:auto;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft)}
.demo-strip{background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--brand-mid)}
.demo-strip button{border:none;background:none;color:var(--brand);font-weight:700;text-decoration:underline;padding:0;font-size:12.5px}
.tabbar{display:none}
.icon-btn{border:none;background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);border:1px solid var(--line)}
.icon-btn:hover{color:var(--ink)}
.avatar-btn{width:38px;height:38px;border-radius:12px;border:none;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:15px}

/* ---------- grids ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:18px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- painel principal ---------- */
.hero{background:linear-gradient(155deg, var(--brand-deep) 0%, var(--brand-base) 100%);color:#fff;border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
:root[data-mode="dark"] .hero{background:linear-gradient(155deg, var(--brand-deep), color-mix(in srgb, var(--brand-base) 80%, #050914))}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.16), transparent 70%);pointer-events:none}
.hero .l{font-size:13.5px;font-weight:500;opacity:.82;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.025em;margin:4px 0 2px;line-height:1.1}
.hero .big small{font-size:20px;font-weight:600;margin-right:3px;opacity:.85}
.hero .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px}
.hero .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:14px 0 12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.hero .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:11px}
.hero .meta span{font-size:12px;font-weight:500;opacity:.75;display:block}
.hero .meta b{font-size:14.5px;font-weight:600}
.hero.neg-state .tag{background:rgba(255,120,120,.28)}

/* ---------- painéis e seções ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel.pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px}
.sec-h h2{font-size:16px;font-weight:600}
.sec-h .meta{font-size:12.5px;color:var(--ink3);font-weight:500}
.link{border:none;background:none;color:var(--brand);font-weight:600;font-size:13.5px;padding:4px 2px;display:inline-flex;align-items:center;gap:2px}
.link:hover{text-decoration:underline}
.sec-note{padding:0 16px 8px;font-size:12.5px;color:var(--ink3)}
.rows{padding:0 6px 6px}
.rows+.rows{margin-top:-6px}
.rows+.rows .row::before{content:"";position:absolute;left:58px;right:10px;top:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;position:relative;min-height:58px}
.row+.row::before{content:"";position:absolute;left:58px;right:10px;top:0;border-top:1px solid var(--line)}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--surface2)}
.row .tile{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.row .tile.ok{background:var(--ok-soft);color:var(--ok)}
.row .tile.in{background:var(--ok-soft);color:var(--ok)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.row .v{font-weight:600;font-size:14.5px;white-space:nowrap}
.row .v.in{color:var(--ok)}
.row.paid .t{color:var(--ink3)}
.row.paid .v{color:var(--ink3)}
.row .chev{color:var(--ink3)}
.row .pbar{height:4px;border-radius:2px;background:var(--track);margin-top:7px;overflow:hidden}
.row .pbar i{display:block;height:100%;background:var(--brand);border-radius:2px}
.row .pbar i.warn{background:var(--warn)} .row .pbar i.bad{background:var(--bad)} .row .pbar i.ok{background:var(--ok)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)}
.st.neutral{background:var(--track);color:var(--ink2)} .st.brand{background:var(--brand-soft);color:var(--brand)}
.note{display:flex;gap:10px;align-items:flex-start;margin:2px 10px 8px;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
.note.warn{background:var(--warn-soft);color:var(--ink)} .note.warn .ic{color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--ink)} .note.bad .ic{color:var(--bad)}
.note.info{background:var(--brand-soft);color:var(--ink)} .note.info .ic{color:var(--brand)}
.note b{font-weight:600}
.paybtn{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.paybtn:hover{border-color:var(--ok)}
.paybtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.paybtn .ic{width:15px;height:15px;stroke-width:3}
.empty{text-align:center;color:var(--ink3);padding:20px 16px 22px;font-size:13.5px}
.empty .ic{display:block;margin:0 auto 8px;width:26px;height:26px;color:var(--ink3);opacity:.7}
.day-h{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;padding:14px 16px 2px}

/* ---------- disponível ---------- */
.avail{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.avail .tile{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.avail .main{flex:1;min-width:0}
.avail .t{font-weight:500;font-size:14.5px}
.avail .s{font-size:12.5px;color:var(--ink3)}
.avail .v{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:1px 0}
.avail .t,.avail .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- atalhos ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 10px}
.qa{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink);padding:4px 0}
.qa span{width:48px;height:48px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;transition:transform .1s}
.qa:hover span{transform:translateY(-1px)}
.qa:active span{transform:scale(.96)}

/* ---------- botões ---------- */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 30%, var(--line))}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.lg{padding:14px 16px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--track);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:none;background:none;padding:7px 13px;border-radius:9px;font-weight:500;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,32,72,.1)}

/* ---------- cartões (carteira) ---------- */
.wallet{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:6px;padding:6px 6px 8px;margin:-6px -6px 10px;scrollbar-width:none}
.wallet::-webkit-scrollbar{display:none}
.cc{flex:0 0 272px;scroll-snap-align:start;border-radius:20px;padding:16px 18px;color:#fff;min-height:164px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border:none;text-align:left;outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s}
.cc.sel{outline-color:var(--ink)}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%, rgba(255,255,255,.22), transparent 55%);pointer-events:none}
.cc .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.cc .nm{font-weight:600;font-size:15px}
.cc .chip{width:32px;height:24px;border-radius:6px;background:linear-gradient(135deg,#F1D58C,#C69B45);opacity:.9}
.cc .lbl{font-size:12px;font-weight:500;opacity:.8;position:relative}
.cc .val{font-size:24px;font-weight:700;letter-spacing:-.02em;position:relative}
.cc .lim{height:4px;background:rgba(255,255,255,.28);border-radius:2px;margin-top:10px;overflow:hidden;position:relative}
.cc .lim i{display:block;height:100%;background:#fff}
.cc .bot{font-size:11.5px;opacity:.85;margin-top:5px;position:relative;display:flex;justify-content:space-between}
.cc.add{background:var(--surface);color:var(--ink2);border:2px dashed var(--line2);align-items:center;justify-content:center;gap:6px;font-weight:600;flex-basis:150px}
.cc.add::before{display:none}
.bill{padding:16px}
.bill .l{font-size:13.5px;font-weight:500;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.bill .big{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:4px 0 2px}
.bill .s{font-size:13px;color:var(--ink3)}
.bill .usage{margin-top:14px}
.bill .usage .track{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin:6px 0 4px}
.bill .usage .track i{display:block;height:100%;background:var(--brand);border-radius:3px}
.bill .usage .track i.warn{background:var(--warn)} .bill .usage .track i.bad{background:var(--bad)}
.bill .actions{display:flex;gap:8px;margin-top:14px}

/* ---------- estatísticas compactas ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stats>div{padding:14px 16px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats .l{font-size:12.5px;font-weight:500;color:var(--ink2)}
.stats .n{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:3px 0 2px}
.stats .s{font-size:12px;color:var(--ink3)}

/* ---------- gráficos ---------- */
.chart{position:relative;padding:4px 12px 4px}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 11px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);padding:4px 16px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.legend i.dash{height:0;width:14px;border-top:2px dashed var(--ink2);border-radius:0;vertical-align:3px}
.stackbar{display:flex;height:12px;gap:2px;border-radius:4px;overflow:hidden;margin:8px 16px 4px}
.stackbar i{display:block;height:100%}
details.tbl{padding:0 16px 14px}
details.tbl summary{cursor:pointer;color:var(--ink2);font-size:13px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--ink3);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}

/* ---------- filtros ---------- */
.searchbox{position:relative;margin-bottom:10px}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbox input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 10px 38px;font-size:14.5px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink2);flex:none}
.sumline{display:flex;gap:0;border-bottom:1px solid var(--line)}
.sumline>div{flex:1;padding:12px 16px;min-width:0}
.sumline>div+div{border-left:1px solid var(--line)}
.sumline .l{font-size:12px;font-weight:500;color:var(--ink3)}
.sumline b{font-size:15.5px;font-weight:700;white-space:nowrap}
@media (max-width:420px){.sumline>div{padding:10px 12px}.sumline b{font-size:14px}}

/* ---------- ajustes ---------- */
.group{margin-bottom:18px}
.group>h3{font-size:12.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin:0 6px 8px}
.set{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;position:relative;border:none;background:none;width:100%;text-align:left;font-size:14.5px}
.set+.set::before{content:"";position:absolute;left:52px;right:0;top:0;border-top:1px solid var(--line)}
button.set:hover{background:var(--surface2)}
.set:first-child{border-radius:var(--r) var(--r) 0 0}.set:last-child{border-radius:0 0 var(--r) var(--r)}.set:only-child{border-radius:var(--r)}
.set .ic.lead{color:var(--ink2)}
.set .t{flex:1;font-weight:500}
.set .v{color:var(--ink3);font-size:13.5px;font-weight:500;text-align:right}
.set.danger .t,.set.danger .ic.lead{color:var(--bad)}
.set-block{padding:12px 14px}
.set-block+.set-block,.set+.set-block,.set-block+.set{border-top:1px solid var(--line)}
.set-block .lab{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:8px}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2);padding:0}
.theme.on{box-shadow:0 0 0 2px var(--ink)}

/* ---------- folhas (formulários) ---------- */
dialog{border:none;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(460px, calc(100% - 24px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px rgba(6,14,40,.3)}
dialog::backdrop{background:rgba(8,14,30,.45);backdrop-filter:blur(2px)}
.sheet{padding:18px 18px calc(16px + env(safe-area-inset-bottom));overflow:auto;max-height:inherit}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:-4px auto 14px}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;font-weight:500;color:var(--ink2)}
.f input,.f select{border:1px solid var(--line2);background:var(--surface2);border-radius:12px;padding:11px 12px;font-size:15px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus{outline:2px solid var(--brand-mid);border-color:var(--brand)}
.f.money input{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .seg{width:100%}
.f .seg button{flex:1}
label.check{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--ink);font-size:14px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--brand)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2);padding:0}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);display:grid;place-items:center;padding:0}
.icons button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .btn{flex:1;padding:12px}
.sheet-actions .btn.danger{flex:0 0 auto}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin:-4px 0 6px}
.preview{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;max-height:220px;overflow:auto}
.preview td{padding:5px 6px;font-size:12.5px}
.ledger{font-size:14px}
.ledger>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.ledger .tot{border-top:1px solid var(--line2);margin-top:4px;padding-top:10px;font-weight:600}
.ledger .big{font-size:24px;font-weight:700}
.hint{font-size:12.5px;color:var(--ink3);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:90;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.act{pointer-events:auto}
.toast button{border:none;background:none;color:color-mix(in srgb, var(--brand-base) 55%, white);font-weight:700;padding:2px 4px;font-size:14px;white-space:nowrap}
:root[data-mode="dark"] .toast button{color:var(--brand-base)}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(360px,1fr) minmax(400px,1.05fr)}
.auth-brand{background:linear-gradient(160deg, var(--brand-deep), var(--brand-base));color:#fff;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-brand::before{content:"";position:absolute;width:520px;height:520px;right:-200px;bottom:-220px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.16), transparent 65%)}
.auth-logo{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;letter-spacing:-.02em;position:relative}
.auth-logo svg{width:38px;height:38px}
.auth-pitch{position:relative;max-width:420px}
.auth-pitch h1{font-size:44px;line-height:1.04;font-weight:700;letter-spacing:-.035em}
.auth-pitch p{font-size:16px;opacity:.85;margin:16px 0 24px}
.auth-pitch ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.auth-pitch li{display:flex;align-items:center;gap:12px;font-weight:500;font-size:14.5px}
.auth-pitch li span{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.auth-foot{font-size:12.5px;opacity:.7;position:relative}
.auth-main{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:100%;max-width:380px}
.auth-card h2{font-size:26px;font-weight:700;letter-spacing:-.025em}
.auth-lead{font-size:14.5px;margin:8px 0 22px;line-height:1.5;color:var(--ink2)}
.auth-mlogo{display:none;align-items:center;gap:10px;margin-bottom:26px;font-weight:700;font-size:18px}
.auth-mlogo svg{width:36px;height:36px}
.auth-btns{display:grid;gap:10px}
.auth-sep{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12.5px;margin:18px 0 6px}
.auth-sep::before,.auth-sep::after{content:"";flex:1;height:1px;background:var(--line2)}
.link-btn{border:none;background:none;color:var(--brand);font-weight:600;padding:8px 0;font-size:14px;display:flex;align-items:center;gap:6px;margin:8px auto 0}
.link-btn:hover{text-decoration:underline}
.back-btn{border:none;background:none;color:var(--ink2);font-weight:500;padding:6px 0;margin-bottom:12px;font-size:14px;display:flex;align-items:center;gap:4px}
.avatar{width:68px;height:68px;border-radius:22px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:28px;font-weight:700;margin:0 auto 16px}
.pw{position:relative}
.pw input{padding-right:46px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;width:36px;height:36px;border-radius:10px;color:var(--ink3);display:grid;place-items:center}
.pw-eye:hover{color:var(--ink);background:var(--track)}
.pw-meter{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin:-4px 0 8px}
.pw-meter i{display:block;height:100%;width:0;transition:width .2s, background .2s}
.auth-check{margin:4px 0 14px;font-size:13.5px;color:var(--ink2)}
.auth-warn{display:flex;gap:10px;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.45}
.auth-warn .ic{color:var(--warn)}
.auth-opt{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.auth-opt b{font-weight:600}

/* ---------- celular ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:10px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
  .top-mini{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
  .top-mini .who{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);font-weight:500}
  .top-mini .acts{display:flex;gap:8px}
  .head{margin-bottom:12px;flex-wrap:nowrap}
  .head h1{font-size:21px}
  .period b{min-width:78px;font-size:13px}
  .cols,.g2{grid-template-columns:1fr;gap:14px}
  .stack{gap:14px}
  .hero .big{font-size:34px}
  .stats{grid-template-columns:1fr 1fr}
  .stats>div:nth-child(3){border-left:none}
  .stats>div:nth-child(n+3){border-top:1px solid var(--line)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  .tabbar .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:4px 2px;align-items:center;text-align:center;border-radius:10px;font-weight:500}

/* ---------- topo do Início (inspirado na referência: painel cheio + atalhos sobrepostos) ---------- */
.only-m{display:none}
.hero-home{text-align:center;padding:22px 20px 54px}
.hero-home .l{justify-content:center}
.hero-home .big{font-size:40px;margin:6px 0 8px}
.hero-home .meta{max-width:420px;margin:16px auto 0;text-align:center}
.hero-home .tag{margin-top:2px}
.quick-card{position:relative;z-index:2;margin:-38px 14px 0;background:var(--surface);border-radius:18px;box-shadow:0 10px 30px rgba(16,32,72,.12);border:1px solid var(--line)}

.hero-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px -2px 18px;text-align:left}
.hero-head .who{display:flex;align-items:center;gap:10px}
.hero-head .avatar-btn{background:rgba(255,255,255,.16);color:#fff}
.hero-head .icon-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.hero-title{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;margin-bottom:18px}
.hero-title h1{font-size:20px;font-weight:600;color:#fff}
.hero-title .period{background:rgba(255,255,255,.12);border-color:transparent}
.hero-title .period b,.hero-title .period button{color:#fff}

.hero-title .period .today{background:rgba(255,255,255,.2);color:#fff}

.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.io .ico{position:absolute;top:12px;left:14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.io .big-ic{position:absolute;right:-8px;top:-8px;opacity:.09;width:76px;height:76px}
.io span{font-size:12px;font-weight:500;opacity:.8}

.total-top .big{font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:2px}

.receipt>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:13.5px;border-top:1px solid var(--line)}

.receipt span{color:var(--ink3);font-weight:500}
.receipt b{font-weight:600;text-align:right}

}
function togglePago(key, valor) {

// Saldo da conta: o último saldo informado, ajustado pelo que aconteceu depois
function saldoAgora() {
  if (!D.saldo) return null;
  // conta o que aconteceu depois do momento em que o saldo foi informado (no mesmo dia, compara o horário)
  const desde = D.saldo.data, t = today(), sts = D.saldo.ts || "";
  const dentro = (d, ts) => d <= t && (d > desde || (d === desde && !!ts && !!sts && ts > sts));
  const linhas = [];
  let salario = 0;
  if (D.perfil.renda) for (let X = ym(desde); X <= ym(t); X = addM(X, 1)) { const pd = dayIn(X, D.perfil.diaSalario); if (pd > desde && pd <= t) salario += D.perfil.renda; }
  const entradas = sum(D.lancs.filter(l => l.tipo === "receita" && dentro(l.data, l.criado)), l => l.valor);
  const aVista = sum(D.lancs.filter(l => l.tipo !== "receita" && l.meio !== "credito" && dentro(l.data, l.criado)), l => l.valor);
  const pagas = sum(Object.values(D.pagos).filter(p => dentro(p.data, p.ts)), p => p.valor);
  const guard = sum(D.metas.flatMap(g => g.movs).filter(x => x.origem !== "extra" && dentro(x.data, x.ts)), x => x.valor);
  if (salario) linhas.push(["Salário recebido", salario]);
  if (entradas) linhas.push(["Entradas registradas", entradas]);
  if (aVista) linhas.push(["Gastos à vista", -aVista]);
  if (pagas) linhas.push(["Contas marcadas como pagas", -pagas]);
  if (guard) linhas.push([guard > 0 ? "Guardado em metas" : "Retirado de metas", -guard]);
  const agora = c2(D.saldo.valor + salario + entradas - aVista - pagas - guard);
  return {agora, linhas};
}

function syncDestino(x) {

}

  return `<div class="row tap" data-fixa="${f.id}">${tileIc(catOf(f.categoria).e)}<div class="main"><div class="t">${esc(f.descricao)}</div><div class="s">${card ? `Assinatura · ${esc(card.nome)} · cobrada ${dShort(c.data)}` : `Fixa · todo dia ${f.dia} · ${MEIOS[f.meio]}`}</div></div><div class="end"><span class="v num">−${brl(c.valor)}</span></div></div>`;
}
function bindCommon(el) {
  el.querySelectorAll("[data-pay]").forEach(b => b.onclick = e => { e.stopPropagation(); const was = !!D.pagos[b.dataset.pay]; togglePago(b.dataset.pay, +b.dataset.val); toast(was ? "Marcada como não paga" : "Conta paga"); });
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { const l = D.lancs.find(x => x.id === b.dataset.edit); if (l) formLanc(l); });
  el.querySelectorAll("[data-fixa]").forEach(b => b.onclick = () => { const f = D.fixas.find(x => x.id === b.dataset.fixa); if (f) formFixa(f); });
  el.querySelectorAll("[data-card]").forEach(b => b.onclick = () => { cartaoSel = b.dataset.card; go("cartoes"); });
  el.querySelectorAll("[data-go2]").forEach(b => b.onclick = () => go(b.dataset.go2));
  el.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { sub.planejar = b.dataset.plan; go("planejar"); });
  el.querySelectorAll("[data-orc]").forEach(b => b.onclick = e => { e.stopPropagation(); formOrc(b.dataset.orc); });
}

    </div>

  const upd = () => { filtro = {q: $("#fq").value, tipo: $("#ft").value, cat: $("#fc").value, meio: $("#fm").value}; drawList(); };
  $("#fq").oninput = upd; $("#ft").onchange = upd; $("#fc").onchange = upd; $("#fm").onchange = upd;

  function drawList() {
    const box = $("#extList"), q = filtro.q.trim().toLowerCase();
    const okL = l => (!q || l.descricao.toLowerCase().includes(q)) && (!filtro.cat || l.categoria === filtro.cat) && (!filtro.meio || (l.tipo !== "receita" && l.meio === filtro.meio)) && (!filtro.tipo || l.tipo === filtro.tipo);
    const okF = f => (!q || f.descricao.toLowerCase().includes(q)) && (!filtro.cat || f.categoria === filtro.cat) && (!filtro.meio || f.meio === filtro.meio) && filtro.tipo !== "receita";

    const grp = (h, html) => `<div class="day-h">${h}</div><div class="rows">${html}</div>`;
    if (s === "compras") {
      const ls = D.lancs.filter(l => ym(l.data) === cur && okL(l)).sort((a, b) => b.data.localeCompare(a.data));
      const dias = [...new Set(ls.map(l => l.data))];
      dias.forEach(d => { const it = ls.filter(l => l.data === d); rows += grp(dName(d), it.map(l => lancRow(l)).join("")); it.forEach(l => { if (l.tipo === "receita") tIn += l.valor; else tOut += l.valor; count++; }); });
    } else {
      const M = mes(cur);
      if (M.renda && !filtro.cat && !filtro.meio && filtro.tipo !== "despesa" && (!q || "salário".includes(q) || "salario".includes(q))) { rows += grp("Salário", `<div class="row tap" data-go2="ajustes">${tileIc("banknote", "in")}<div class="main"><div class="t">Salário</div><div class="s">Cai todo dia ${D.perfil.diaSalario}</div></div><div class="end"><span class="v num in">+${brl(M.renda)}</span></div></div>`); tIn += M.renda; count++; }
      const fxA = M.fx.filter(c => c.f.meio !== "credito" && okF(c.f));
      if (fxA.length) { rows += grp("Contas fixas", fxA.map(fixaRow).join("")); tOut += sum(fxA, c => c.valor); count += fxA.length; }
      const ps = M.desp.concat(M.rec).filter(p => okL(p.l)).sort((a, b) => b.l.data.localeCompare(a.l.data));
      const par = ps.filter(p => p.l.meio === "credito" && p.l.tipo !== "receita"), av = ps.filter(p => !(p.l.meio === "credito" && p.l.tipo !== "receita"));
      const fxC = M.fx.filter(c => c.f.meio === "credito" && okF(c.f));
      if (par.length || fxC.length) { rows += grp("Faturas de cartão", fxC.map(fixaRow).join("") + par.map(p => lancRow(p.l, p)).join("")); tOut += sum(par, p => p.valor) + sum(fxC, c => c.valor); count += par.length + fxC.length; }
      if (av.length) { rows += grp("À vista e entradas", av.map(p => lancRow(p.l, p)).join("")); av.forEach(p => { if (p.l.tipo === "receita") tIn += p.valor; else tOut += p.valor; }); count += av.length; }
      const movs = !q && !filtro.cat && !filtro.meio && filtro.tipo !== "receita" ? D.metas.flatMap(g => g.movs.filter(x => x.origem !== "extra" && ym(x.data) === cur).map(x => ({g, x}))) : [];
      if (movs.length) { rows += grp("Guardado em metas", movs.map(({g, x}) => `<div class="row tap" data-plan="metas">${tileIc(g.emoji)}<div class="main"><div class="t">${esc(g.nome)}</div><div class="s">${dShort(x.data)} · ${x.valor >= 0 ? "guardado do salário" : "retirada"}</div></div><div class="end"><span class="v num">${x.valor >= 0 ? "−" : "+"}${brl(Math.abs(x.valor))}</span></div></div>`).join("")); tG = sum(movs, m => m.x.valor); }
    }
    tIn = c2(tIn); tOut = c2(tOut); const res = c2(tIn - tOut - tG);
    box.innerHTML = `<div class="sumline"><div><div class="l">Entradas</div><b class="num pos">+${brl(tIn)}</b></div><div><div class="l">Saídas</div><b class="num">−${brl(tOut)}</b></div><div><div class="l">${tG ? "Após guardar" : "Resultado"}</div><b class="num ${res < 0 ? "neg" : ""}">${res < 0 ? "−" + brl(-res) : brl(res)}</b></div></div>
      ${rows || emptyBox("search", s === "compras" ? "Nenhum lançamento feito neste mês." : "Nada pesando neste mês.")}
      <p class="muted" style="margin:6px 16px 14px">${count} ${count === 1 ? "item" : "itens"}. ${s === "compras" ? "Tudo o que você registrou com data neste mês, inclusive compras no crédito que só pesam nas próximas faturas." : "Tudo o que sai do salário deste mês: contas fixas, faturas que vencem agora, gastos à vista e o que você guardou."}</p>`;
    bindCommon(box);
  }

    + (lp != null && lp >= 80 ? `<div class="note ${lp >= 100 ? "bad" : "warn"}">${ICO("gauge", "s18")}<div><b>${lp >= 100 ? "Limite do cartão estourado." : "Limite do cartão quase no fim."}</b> ${brl(ab)} em aberto de ${brl(c.limite)}.</div></div>` : "");
  const bill = `<div class="panel"><div class="bill">

// ---------- gráfico de barras ----------
function barChart(box, o) {
  const W = Math.max(260, (box.clientWidth || 600) - 24), H = o.height || 200, pl = 40, pr = 4, pt = 12, pb = 24, n = o.values.length;
  const max = Math.max(1, ...o.values, ...(o.ref || [])) * 1.1, stp = nice(max / 4), top = Math.ceil(max / stp) * stp;
  const y = v => pt + (H - pt - pb) * (1 - v / top), bw = (W - pl - pr) / n, w = Math.min(22, bw * .5);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Gráfico de barras">`;
  for (let v = 0; v <= top + 1e-6; v += stp) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="2 4"' : ""}/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" font-family="DM Sans, sans-serif" fill="var(--ink3)">${brlK(v)}</text>`;
  o.values.forEach((v, i) => {
    const x = pl + i * bw + (bw - w) / 2, h = y(0) - y(Math.max(0, v)), r = Math.min(4, h, w / 2);
    if (h > .5) s += `<path d="M${x},${y(0)}V${y(v) + r}Q${x},${y(v)} ${x + r},${y(v)}H${x + w - r}Q${x + w},${y(v)} ${x + w},${y(v) + r}V${y(0)}Z" fill="${o.color || "var(--brand)"}" opacity="${o.opacity ? o.opacity(i) : (i === o.hi ? 1 : .55)}"/>`;
    if (o.warn && o.warn(i)) s += `<circle cx="${x + w / 2}" cy="${y(v) - 8}" r="3" fill="var(--bad)"/>`;
    s += `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" font-family="DM Sans, sans-serif" font-weight="${i === o.hi ? 700 : 500}" fill="${i === o.hi ? "var(--ink)" : "var(--ink3)"}">${o.labels[i]}</text>`;
  });
  if (o.ref) { let d = ""; o.ref.forEach((v, i) => { d += `M${pl + i * bw + 3},${y(v)}H${pl + (i + 1) * bw - 3}`; }); s += `<path d="${d}" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/>`; }
  o.values.forEach((v, i) => s += `<rect data-i="${i}" x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent" style="cursor:${o.click ? "pointer" : "default"}"/>`);
  box.innerHTML = s + "</svg>";
  const tip = $("#tip");
  box.querySelectorAll("rect[data-i]").forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener("pointermove", e => { tip.innerHTML = o.tip(i); tip.style.opacity = 1; const tw = tip.offsetWidth; let lx = e.clientX + 14; if (lx + tw > innerWidth - 8) lx = e.clientX - tw - 14; tip.style.left = Math.max(8, lx) + "px"; tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 10) + "px"; });
    r.addEventListener("pointerleave", () => tip.style.opacity = 0);
    if (o.click) r.addEventListener("click", () => { tip.style.opacity = 0; o.click(i); });
  });
}
const nice = x => { const p = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };

async function lerArquivo(f) {
  const buf = await f.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("iso-8859-1").decode(buf);
  return t.replace(/^﻿/, "");
}
$("#importFile").onchange = async e => {

    if (!D || modoDemo) { if (modoDemo) { modoDemo = false; D = null; } pendente = normalize(o); authView = "backup"; render(); return; }
    const aplicar = () => { const snap = JSON.stringify(D); D = normalize(o); save(); render(); toast("Backup importado", () => { D = normalize(JSON.parse(snap)); save(); render(); }); };

  } catch (_) { toast("Esse arquivo não é um backup do Fôlego"); }
};

function parseCSV(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const cnt = ch => (first.match(new RegExp("\\" + ch, "g")) || []).length;
  const sep = [";", ",", "\t"].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(f.trim()); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f.trim()); if (row.some(x => x !== "")) rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  row.push(f.trim()); if (row.some(x => x !== "")) rows.push(row);
  return rows;
}
function parseData(s) {
  s = String(s || "").trim().slice(0, 10);
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; const mm = +m[2], dd = +m[1]; if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return `${y}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`; }
  return null;
}
const sugerirCat = d => { for (const [c, re] of AUTO_CAT) if (re.test(d)) return c; return "outros"; };
$("#csvFile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  if (!D) { toast("Comece o app antes de importar um extrato"); return; }
  let rows; try { rows = parseCSV(await lerArquivo(file)); } catch (_) { rows = []; }
  if (rows.length < 2) { toast("Não encontrei linhas nesse arquivo"); return; }
  // encontra a linha de cabeçalho (primeira com uma coluna que pareça data e outra que pareça valor nas linhas seguintes)
  let hi = 0;
  for (let i = 0; i < Math.min(rows.length - 1, 15); i++) { if (rows[i].length >= 2 && rows[i + 1] && rows[i + 1].some(c => parseData(c)) && !rows[i].some(c => parseData(c))) { hi = i; break; } }
  const head = rows[hi], body = rows.slice(hi + 1).filter(r => r.length >= 2);
  const cols = head.map((h, i) => [String(i), h || `Coluna ${i + 1}`]);
  const find = (re, fb) => { const i = head.findIndex(h => re.test(h)); return String(i > -1 ? i : fb); };
  const iData = find(/data|date/i, body[0] ? Math.max(0, body[0].findIndex(c => parseData(c))) : 0);
  const iValor = find(/valor|amount|value|montante/i, body[0] ? Math.max(0, body[0].findIndex((c, k) => String(k) !== iData && !isNaN(money(c)))) : 1);
  const iDesc = find(/descri|title|hist[oó]rico|estabelec|lan[cç]amento|memo|detalhe/i, head.findIndex((h, k) => String(k) !== iData && String(k) !== iValor));
  const nubankFatura = head.join(",").toLowerCase() === "date,title,amount";
  const interpret = v => {
    const out = [], dup = new Set(D.lancs.map(l => `${l.data}|${c2(l.valor)}|${l.descricao.toLowerCase()}`)); let ignor = 0, dups = 0, inval = 0;
    body.forEach(r => {
      const data = parseData(r[+v.cData]), valor = money(r[+v.cValor]), desc = String(r[+v.cDesc] || "").trim() || "Sem descrição";
      if (!data || isNaN(valor) || valor === 0) { inval++; return; }
      const saida = v.sinal === "pos" ? valor > 0 : valor < 0;
      if (!saida && v.semEntradas) { ignor++; return; }
      const abs = Math.abs(valor), key = `${data}|${c2(abs)}|${desc.toLowerCase()}`;
      if (dup.has(key)) { dups++; return; }
      dup.add(key);
      out.push({tipo: saida ? "despesa" : "receita", data, valor: abs, descricao: desc.slice(0, 60), categoria: saida ? sugerirCat(desc) : "rout"});
    });
    return {out, ignor, dups, inval};
  };
  const cardOpts = D.cartoes.map(c => [c.id, c.nome]);
  sheet({title: "Importar extrato", submit: "Importar",
    fields: [{k: "_info", type: "html", html: () => `<p class="sub" style="margin:-6px 0 12px">${esc(file.name)} · ${body.length} linhas. Confira as colunas e a prévia antes de importar.</p>`},
      {row: [{k: "cData", label: "Coluna da data", type: "select", options: cols}, {k: "cValor", label: "Coluna do valor", type: "select", options: cols}]},
      {k: "cDesc", label: "Coluna da descrição", type: "select", options: cols},
      {k: "sinal", label: "Como as saídas aparecem no arquivo", type: "seg", options: [["neg", "Valor negativo"], ["pos", "Valor positivo"]], help: "Extrato de conta: geralmente negativo. Fatura de cartão: geralmente positivo."},
      {k: "meio", label: "Essas saídas foram pagas no", type: "seg", options: [["debito", "Débito"], ["pix", "Pix"], ["credito", "Crédito"]]},
      {k: "cartaoId", label: "Cartão", type: "select", options: cardOpts.length ? cardOpts : [["", "Cadastre um cartão primeiro"]], when: v => v.meio === "credito"},
      {k: "semEntradas", type: "check", text: "Ignorar entradas", help: "Recomendado: o extrato costuma trazer o salário (que o Fôlego já conta), pagamentos de fatura e estornos."},
      {k: "_prev", type: "html", html: v => { const r = interpret(v); return `<div class="preview-box"><b>${r.out.length} lançamento(s) serão importados</b>${r.dups ? ` · ${r.dups} já existem` : ""}${r.ignor ? ` · ${r.ignor} entradas ignoradas` : ""}${r.inval ? ` · ${r.inval} linhas sem data ou valor` : ""}
        ${r.out.length ? `<table style="margin-top:6px"><tbody>${r.out.slice(0, 6).map(x => `<tr><td>${dShort(x.data)}</td><td>${esc(x.descricao)} <span class="muted">· ${esc(catOf(x.categoria).nome)}</span></td><td class="r num ${x.tipo === "receita" ? "pos" : ""}">${x.tipo === "receita" ? "+" : "−"}${brl(x.valor)}</td></tr>`).join("")}</tbody></table>${r.out.length > 6 ? `<div class="muted">e mais ${r.out.length - 6}…</div>` : ""}` : ""}</div>`; }}],
    values: {cData: iData, cValor: iValor, cDesc: String(Math.max(0, +iDesc)), sinal: nubankFatura ? "pos" : "neg", meio: nubankFatura ? "credito" : "debito", cartaoId: (cardOpts[0] || [""])[0], semEntradas: true},
    onSubmit: v => {
      if (v.meio === "credito" && !v.cartaoId) return "Cadastre um cartão antes de importar uma fatura.";
      const r = interpret(v); if (!r.out.length) return "Nada para importar com essas opções.";
      comDesfazer(`${r.out.length} lançamento(s) importados. As categorias foram sugeridas: revise no extrato.`, () => {
        r.out.forEach(x => D.lancs.push({id: uid(), tipo: x.tipo, descricao: x.descricao, valor: x.valor, data: x.data, categoria: x.categoria,
          meio: x.tipo === "receita" ? null : v.meio, cartaoId: x.tipo !== "receita" && v.meio === "credito" ? v.cartaoId : null, parcelas: 1, antecipacoes: [], criado: nowTs()}));
      });
    }});
};

function sheet({title, fields, values = {}, submit = "Salvar", onSubmit, onDelete, deleteLabel = "Excluir"}) {
  const dlg = $("#sheet"), body = $("#sheetBody"), V = Object.assign({}, values);
  const flat = []; fields.forEach(f => f.row ? f.row.forEach(x => flat.push(x)) : flat.push(f));
  const fieldHTML = f => {
    const id = "f_" + f.k, v = V[f.k] ?? "";

    if (f.type === "html") return `<div data-fk="${f.k}" id="${id}"></div>`;
    if (f.type === "select") inner = `<select id="${id}">${f.options.map(([k, n]) => `<option value="${esc(k)}"${String(k) === String(v) ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    else if (f.type === "seg") inner = `<div class="seg" id="${id}" role="group">${f.options.map(([k, n]) => `<button type="button" data-v="${esc(k)}" class="${k === v ? "on" : ""}">${n}</button>`).join("")}</div>`;
    else if (f.type === "swatch") inner = `<div class="swatches" id="${id}">${f.options.map(([k, c, n]) => `<button type="button" data-v="${k}" class="${String(k) === String(v) ? "on" : ""}" style="background:${c}" aria-label="${n}" title="${n}"></button>`).join("")}</div>`;
    else if (f.type === "emoji") inner = `<div class="icons" id="${id}" role="group">${f.options.map(k => `<button type="button" data-v="${k}" class="${k === v ? "on" : ""}" aria-label="${k}">${ICO(k, "s18")}</button>`).join("")}</div>`;
    else if (f.type === "check") inner = `<label class="check"><input type="checkbox" id="${id}"${v ? " checked" : ""}>${f.text}</label>`;
    else { const t = f.type === "money" ? "text" : f.type || "text"; const val = f.type === "money" ? (v === "" || v == null || (v === 0 && !f.neg) ? "" : String(v).replace(".", ",")) : v;
      inner = `<input id="${id}" type="${t}" value="${esc(val)}" placeholder="${esc(f.ph || (f.type === "money" ? "0,00" : ""))}"${f.type === "money" ? ' inputmode="decimal"' : ""}${f.type === "number" ? ' inputmode="numeric"' : ""}${f.min != null ? ` min="${f.min}"` : ""}${f.max != null ? ` max="${f.max}"` : ""}${f.max2 ? ` maxlength="${f.max2}"` : f.type === "text" || !f.type ? ' maxlength="60"' : ""}${f.cls ? ` class="${f.cls}"` : ""} autocomplete="off">`; }
    return `<div class="f ${f.type === "money" ? "money" : ""}" data-fk="${f.k}">${f.label ? `<span>${f.label}</span>` : ""}${inner}${f.help ? `<span class="muted" style="font-weight:500">${f.help}</span>` : ""}</div>`;
  };
  body.innerHTML = `<div class="grab"></div><h2>${title}</h2><form id="sheetForm" novalidate>
    ${fields.map(f => f.row ? `<div class="frow" data-row>${f.row.map(fieldHTML).join("")}</div>` : fieldHTML(f)).join("")}

    <div class="sheet-actions">${onDelete ? `<button type="button" class="btn danger" id="sDel">${deleteLabel}</button>` : ""}<button type="button" class="btn" id="sCancel">Cancelar</button><button class="btn primary" type="submit">${submit}</button></div></form>`;
  const read = () => { flat.forEach(f => { const e = body.querySelector("#f_" + f.k); if (!e || f.type === "html") return;
    if (["seg", "swatch", "emoji"].includes(f.type)) { const on = e.querySelector(".on"); V[f.k] = on ? (f.type === "swatch" ? +on.dataset.v : on.dataset.v) : V[f.k]; }
    else if (f.type === "check") V[f.k] = e.checked;
    else if (f.type === "money") { V[f.k] = e.value.trim() ? money(e.value) : 0; V[f.k + "Touched"] = !!e.value.trim(); }
    else if (f.type === "number") V[f.k] = e.value === "" ? null : +e.value;
    else V[f.k] = e.value; }); return V; };
  const vis = () => { read();
    flat.forEach(f => { const w = body.querySelector(`[data-fk="${f.k}"]`); if (f.when) w.style.display = f.when(V) ? "" : "none"; if (f.type === "html") w.innerHTML = f.html(V); });
    body.querySelectorAll("[data-row]").forEach(r => r.style.display = [...r.children].every(c => c.style.display === "none") ? "none" : ""); };
  body.querySelectorAll(".seg,.swatches,.icons").forEach(g => g.addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (!b) return; g.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); vis(); }));
  body.querySelectorAll("input,select").forEach(i => { i.addEventListener("change", vis); if (i.tagName === "INPUT" && i.type !== "checkbox") i.addEventListener("input", () => { if (flat.some(f => f.type === "html")) vis(); }); });

      if (f.req && (V[f.k] === "" || V[f.k] == null || (typeof V[f.k] === "string" && !V[f.k].trim()) || (f.type === "money" && !(V[f.k] > 0)))) { $("#sheetErr").textContent = `Preencha: ${f.label || f.k}`; return; }
      if (f.type === "number" && V[f.k] != null && ((f.min != null && V[f.k] < f.min) || (f.max != null && V[f.k] > f.max))) { $("#sheetErr").textContent = `${f.label}: use um número entre ${f.min} e ${f.max}`; return; } }
